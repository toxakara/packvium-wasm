name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # Every Node the manifest's `engines` admits, from its floor: a test command that only
  # one Node runs is how a quoted glob passed on 22 and failed on 16-20.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Fails a pull request that introduces a dependency with a known vulnerability or a
  # licence the project has not accepted. It reads GitHub's dependency graph, so it needs
  # nothing committed here beyond this job -- and on a package with no dependencies its
  # usual answer is "nothing changed", which is the answer we want to keep true.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
